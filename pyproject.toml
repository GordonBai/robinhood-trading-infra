[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "martin-agentic"
version = "0.1.0"
description = "Offline-first trading research and risk controls"
requires-python = ">=3.11"
dependencies = [
    "exchange-calendars==4.13.2",
]

[project.scripts]
martin-agentic = "martin_agentic.cli:main"

[project.optional-dependencies]
audit-storage = [
    "boto3>=1.40,<2",
]

[tool.setuptools.packages.find]
where = ["infra/src", "strategy/martin_luk/src", "strategy/examples/src"]

[tool.setuptools.package-data]
martin_agentic = ["web/*.html", "web/*.css", "web/*.js"]
